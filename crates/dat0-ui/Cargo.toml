[package]
name = "dat0-ui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/accidentally-awesome-labs/dat0"
authors = ["Accidentally Awesome Labs"]
rust-version = "1.85"

[[bin]]
name = "dat0"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
# The real-window perf harness (`src/perf.rs` + `examples/perf_harness.rs`).
# Off by default so a release build never links the fixture generator; turned on
# for this crate's own targets by the self-dev-dependency below.
perf-harness = ["dat0-core/perf-harness"]
# The token gallery: a dev-only surface, same mechanism.
gallery = []
# The visual scene catalogue (`src/visual/`), read by `tests/visual_snapshot.rs`,
# `examples/visual_probe.rs` and `examples/visual_page.rs`. Dev-only.
# Implies `gallery`, because `gallery/tokens` is one of the scenes.
visual = ["dep:tempfile", "gallery"]

[dependencies]
dioxus = { version = "=0.7.10", features = ["desktop"] }
dioxus-desktop = "=0.7.10"
dat0-core = { path = "../dat0-core" }
dat0-engine = { path = "../dat0-engine" }
dat0-format = { path = "../dat0-format" }
dat0-i18n = { path = "../dat0-i18n" }
dat0-keychain = { path = "../dat0-keychain" }
duckdb = { version = "=1.4.4", features = ["bundled", "json", "parquet"] }
# Every web asset is served from the binary through the custom protocol (see
# src/protocol.rs), so a plain `cargo build` yields a self-contained executable
# and `xtask` bundling stays a copy. No manganis, no Tailwind, no `dx` CLI.
rust-embed = { version = "8.7.2", features = ["interpolate-folder-path", "include-exclude"] }
# dioxus-desktop provides no clipboard.
arboard = "3.6.1"
# Imperative file dialogs; matches the version dioxus itself pins.
rfd = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v7"] }
futures = "0.3"
parking_lot = "0.12"
sentry = { version = "0.36", default-features = false, features = ["backtrace", "panic", "rustls", "reqwest"] }
plotters = { version = "0.3.7", default-features = false, features = [
    "bitmap_backend", "bitmap_encoder", "svg_backend",
    "all_series", "all_elements", "colormaps", "full_palette", "ttf",
] }

# Scene fixtures for the `visual` feature write a scratch CSV and a recovery
# directory. Optional because a release build has no scenes; `tempfile` is
# otherwise a dev-dependency, and `src/` cannot reach those.
tempfile = { workspace = true, optional = true }

# See `crates/dat0-core/Cargo.toml`: plotters' `ttf` feature pulls font-kit,
# whose non-dlopen fontconfig path does not link against
# yeslogic-fontconfig-sys v6.
[target.'cfg(target_os = "linux")'.dependencies]
font-kit = { version = "0.14.3", default-features = false, features = ["source-fontconfig-dlopen"] }

[dev-dependencies]
dioxus-ssr = "=0.7.10"
dioxus-core = "=0.7.10"
insta = "1"
serial_test = "3"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
dat0-engine = { path = "../dat0-engine" }
dat0-fixtures = { path = "../dat0-fixtures" }
# `examples/visual_page.rs` inlines the fonts as data URIs so the emitted page
# needs nothing from disk. Dev-only: the shipped binary serves them over the
# `dat0://` protocol instead.
base64 = "0.22"
# The self-dev-dependency turns `gallery` and `perf-harness` ON for this crate's
# own test and example targets, so a flag-free `cargo test --all-targets`
# compiles both in with no CI change. Neither reaches a release build.
dat0-ui = { path = ".", features = ["gallery", "perf-harness", "visual"] }

[[example]]
name = "grid_spike"
path = "examples/grid_spike.rs"

[[example]]
name = "editor_spike"
path = "examples/editor_spike.rs"



[[example]]
name = "shell_probe"
path = "examples/shell_probe.rs"

[[example]]
name = "window_probe"
path = "examples/window_probe.rs"

[[example]]
name = "console_probe"
path = "examples/console_probe.rs"

[[example]]
name = "eval_probe"
path = "examples/eval_probe.rs"
