[package]
name = "dat0-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "dat0"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
notify = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
dirs = { workspace = true }
sentry = { workspace = true }
regex = { workspace = true }
ureq = { workspace = true }
gpui = { workspace = true }
gpui-component = { workspace = true }
# P5b autocomplete: gpui-component's CompletionProvider trait is generic over
# lsp-types + ropey. gpui-component re-exports only Rope/Position, not the
# Completion* types, so dat0 names them directly. Pin to gpui-component's exact
# resolved versions (Cargo.lock: lsp-types 0.97.0, ropey 2.0.0-beta.1) to avoid
# a second copy in the tree.
lsp-types = "=0.97.0"
ropey = "=2.0.0-beta.1"
dat0-engine = { workspace = true }
duckdb = { workspace = true }
dat0-i18n = { workspace = true }
dat0-keychain = { workspace = true }
fs4 = { workspace = true }
gethostname = { workspace = true }
libc = { workspace = true }
interprocess = { workspace = true }
uuid = { workspace = true }
lru = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
# SQL syntax highlighting in the P5 console. The grammar is registered at
# runtime via gpui-component's LanguageRegistry (P5a §0 decision 6). We
# deliberately do NOT enable gpui-component's all-or-nothing
# `tree-sitter-languages` feature (~28 grammars; CI OOM/disk cost), so there
# is no second copy of this crate in the build — the `tree-sitter-languages`
# bundle is off and never compiled. The "0.3.8" pin matches gpui-component's
# own declaration (harmless caret); Cargo resolves both to a single 0.3.x copy.
tree-sitter-sequel = "0.3.8"

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
serial_test = { workspace = true }
# T1 (P3b): TestAppContext::single() lives behind the `test-support` feature
# on gpui (see docs/internal/gpui-api-notes.md §0.A.9). Required by the
# main-thread-dispatcher integration test.
gpui = { workspace = true, features = ["test-support"] }
# T8 (P3b): in-process HTTP mock for sample_data::fetch_remote tests.
mockito = { workspace = true }

[[bench]]
name = "engine_smoke"
harness = false

[[bench]]
name = "grid_scroll"
harness = false

[lib]
path = "src/lib.rs"
