[package]
name = "dat0-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "dat0"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
notify = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
dirs = { workspace = true }
sentry = { workspace = true }
regex = { workspace = true }
ureq = { workspace = true }
url = "2"
gpui = { workspace = true }
gpui-component = { workspace = true }
# P5b autocomplete: gpui-component's CompletionProvider trait is generic over
# lsp-types + ropey. gpui-component re-exports only Rope/Position, not the
# Completion* types, so dat0 names them directly. Pin to gpui-component's exact
# resolved versions (Cargo.lock: lsp-types 0.97.0, ropey 2.0.0-beta.1) to avoid
# a second copy in the tree.
lsp-types = "=0.97.0"
ropey = "=2.0.0-beta.1"
dat0-engine = { workspace = true }
dat0-format = { workspace = true }
duckdb = { workspace = true }
dat0-i18n = { workspace = true }
dat0-keychain = { workspace = true }
# P8 T4: headless CLI front-door (export/unpack/inspect/replay/diff) parsing.
clap = { workspace = true }
# P8 T7: replay needs a throwaway scratch tempdir (production code path).
tempfile = { workspace = true }
fs4 = { workspace = true }
gethostname = { workspace = true }
libc = { workspace = true }
interprocess = { workspace = true }
uuid = { workspace = true }
lru = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
minisign-verify = "0.2" # P10a-2 updater: Ed25519 manifest signature verification (verify-only, no transitive deps)
# SQL syntax highlighting in the P5 console. The grammar is registered at
# runtime via gpui-component's LanguageRegistry (P5a §0 decision 6). We
# deliberately do NOT enable gpui-component's all-or-nothing
# `tree-sitter-languages` feature (~28 grammars; CI OOM/disk cost), so there
# is no second copy of this crate in the build — the `tree-sitter-languages`
# bundle is off and never compiled. The "0.3.8" pin matches gpui-component's
# own declaration (harmless caret); Cargo resolves both to a single 0.3.x copy.
tree-sitter-sequel = "0.3.8"
# P9a Charts: render the 7 chart types to a bitmap buffer (BGRA→GPUI img) +
# PNG/SVG export. See workspace Cargo.toml for the feature rationale.
plotters = { workspace = true }
# P9a T7 wiring: build a gpui `RenderImage` from the chart's BGRA buffer.
# `RenderImage::new` takes `SmallVec<[image::Frame; 1]>`, and `Frame::new`
# wraps an `image::ImageBuffer`. These are gpui 0.2.2's exact transitive deps
# (gpui declares `image = "0.25.1"`, `smallvec = "1.6"`); pin to compatible
# ranges so Cargo resolves a SINGLE copy shared with gpui (verified: both
# resolve to image 0.25.10 + smallvec 1.15.1) — no second image/smallvec copy.
image = { version = "0.25", default-features = false }
smallvec = "1"
# UAT Gap 2 (AccessKit content-assertion): TEST-ONLY, feature-gated. These are
# OPTIONAL and only linked when `a11y-capture` is on (dev/test builds via the
# self-dev-dependency below). Release builds (`cargo build`) never see them —
# `.a11y()` is an identity no-op. Does NOT provide production a11y (D-015 open).
accesskit = { workspace = true, optional = true }
accesskit_consumer = { workspace = true, optional = true }

[features]
# UAT Gap 2: turns on AccessKit capture during renders. It ALSO enables
# `gpui/test-support`, because `.a11y()` chains `debug_selector`, which only
# exists under `#[cfg(any(test, feature = "test-support"))]`. Auto-activated for
# this crate's integration tests via the self-dev-dependency below, so CI's
# flag-free `cargo test --workspace` still compiles capture in.
a11y-capture = ["dep:accesskit", "dep:accesskit_consumer", "gpui/test-support"]

# A4 token gallery: dev-only surface (`src/gallery.rs` + `examples/gallery.rs`).
# Turned on for this crate's test/example targets by the self-dev-dependency
# below — same mechanism as `a11y-capture` — so it is never in a release build.
gallery = []

# P9a Charts (Linux build fix): plotters' `ttf` feature pulls `font-kit`, which on
# Linux compiles its `sources/fontconfig.rs` against `yeslogic-fontconfig-sys` v6.
# v6 exposes the `Fc*` symbols ONLY through its dlopen `statics::LIB` handle, so
# font-kit's non-dlopen path (`use ffi::*` + free-function dispatch) fails with
# `error[E0425]: cannot find function FcInitLoadConfigAndFonts`. Enabling font-kit's
# `source-fontconfig-dlopen` feature switches it to the dlopen path (and turns on
# `yeslogic-fontconfig-sys/dlopen`), resolving the symbols at runtime via
# libfontconfig.so.1 (present on Linux). plotters doesn't enable this feature itself.
# macOS (Core Text) and Windows (DirectWrite) never compile the fontconfig module,
# so this dep is Linux-only. font-kit is already in the tree via plotters 0.3.7.
[target.'cfg(target_os = "linux")'.dependencies]
font-kit = { version = "0.14.3", default-features = false, features = ["source-fontconfig-dlopen"] }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
serial_test = { workspace = true }
# T1 (P3b): TestAppContext::single() lives behind the `test-support` feature
# on gpui (see docs/internal/gpui-api-notes.md §0.A.9). Required by the
# main-thread-dispatcher integration test.
gpui = { workspace = true, features = ["test-support"] }
# T8 (P3b): in-process HTTP mock for sample_data::fetch_remote tests.
mockito = { workspace = true }
# UAT-automation proof slice: insta gates the SERIALIZED state behavioral flows
# produce (see `tests/onboarding_gpui.rs`). Committed `.snap` files are the CI
# regression gate — insta never auto-creates snapshots under `CI`.
insta = { workspace = true }
# UAT Gap 2: the self-dev-dependency turns the `a11y-capture` feature ON for this
# crate's own integration tests (a11y_spike.rs), so CI's flag-free
# `cargo test --workspace` compiles capture in with no ci.yml change. kittest
# reads the emitted `accesskit::TreeUpdate` (query by label/role).
dat0-app = { path = ".", features = ["a11y-capture", "gallery"] }
kittest = { workspace = true }

[[bench]]
name = "engine_smoke"
harness = false

[[bench]]
name = "grid_scroll"
harness = false

[[bench]]
name = "chart_render"
harness = false

[lib]
path = "src/lib.rs"
