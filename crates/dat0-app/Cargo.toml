[package]
name = "dat0-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "dat0"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
notify = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
dirs = { workspace = true }
sentry = { workspace = true }
regex = { workspace = true }
ureq = { workspace = true }
gpui = { workspace = true }
gpui-component = { workspace = true }
dat0-engine = { workspace = true }
duckdb = { workspace = true }
dat0-i18n = { workspace = true }
dat0-keychain = { workspace = true }
fs4 = { workspace = true }
interprocess = { workspace = true }
uuid = { workspace = true }
lru = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
serial_test = { workspace = true }
# T1 (P3b): TestAppContext::single() lives behind the `test-support` feature
# on gpui (see docs/internal/gpui-api-notes.md §0.A.9). Required by the
# main-thread-dispatcher integration test.
gpui = { workspace = true, features = ["test-support"] }
# T8 (P3b): in-process HTTP mock for sample_data::fetch_remote tests.
mockito = { workspace = true }

[[bench]]
name = "engine_smoke"
harness = false

[[bench]]
name = "grid_scroll"
harness = false

[lib]
path = "src/lib.rs"
