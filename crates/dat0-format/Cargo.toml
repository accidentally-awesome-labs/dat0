[package]
name = "dat0-format"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }
sha2 = { workspace = true }        # used by the Writer (T2) / Reader (T3) for sha256 checksums
# `serde` feature required: model types derive Serialize/Deserialize over uuid::Uuid.
# Additive over the workspace pin's `v7` feature (uuid features are additive).
uuid = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
anyhow = { workspace = true }      # used by the ReplayEngine/diff helpers (T5/T6)
dat0-engine = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }    # used by writer/reader/replay integration tests (T2+)
jsonschema = { workspace = true }
tokio = { workspace = true }       # used by engine-backed async integration tests (T2+)
