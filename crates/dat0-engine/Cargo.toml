[package]
name = "dat0-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
duckdb.workspace = true
futures.workspace = true
num_cpus.workspace = true
parking_lot.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
# Was a normal dependency for `export::export_table_bytes`, which buffered a whole
# export into a `Vec<u8>` and was deleted in EN3. Nothing under `src/` needs a
# temp file any more; the export tests do.
tempfile.workspace = true
criterion = { workspace = true }
dat0-fixtures = { path = "../dat0-fixtures" }
# UAT-automation proof slice: snapshot-gate the compiled view SQL for a realistic
# composite transform stack (where the nested overlay output is too long to hand-
# maintain as an `assert_eq!` literal). Committed `.snap` = CI regression baseline.
insta = { workspace = true }

[[bench]]
name = "view_regen"
harness = false

[[bench]]
name = "profile_bench"
harness = false
