[workspace]
resolver = "2"
members = [
    "crates/dat0-app",
    "crates/dat0-engine",
    "crates/dat0-format",
    "crates/dat0-i18n",
    "crates/dat0-keychain",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/accidentally-awesome-labs/dat0"
authors = ["Accidentally Awesome Labs"]
rust-version = "1.85"

[workspace.dependencies]
# Async + utilities
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
notify = "6"
once_cell = "1"

# GPUI (verified pins per docs/internal/gpui-api-notes.md, T0 finding 2026-04-26).
# gpui/gpui-macros are now published to crates.io as of v0.2.0 (PR #39835); v0.2.2 publish
# commit is zed-industries/zed @ 08d95ad9d31f616a43dacda8416568d658dca6ae. gpui-component
# v0.5.1 itself declares `gpui = "0.2.2"` in its workspace Cargo.toml — i.e. the upstream
# component crate consumes gpui as a published crate, not as a git dep on
# zed-industries/zed. We mirror that here with exact-version pins (`=0.2.2`) plus the SHA
# recorded in docs/upstream-watch.md for traceability.
gpui = "=0.2.2"
gpui-macros = "=0.2.2"
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "0f0ab35233212f8f3277028995caf0c41e13ee6c" }

# Telemetry
sentry = { version = "0.36", default-features = false, features = ["backtrace", "panic", "rustls", "reqwest"] }

# Bench
criterion = { version = "0.5", features = ["html_reports"] }

# Internal crates
dat0-i18n = { path = "crates/dat0-i18n" }
dat0-keychain = { path = "crates/dat0-keychain" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.bench]
debug = true
