[workspace]
resolver = "2"
members = [
    "crates/dat0-app",
    "crates/dat0-engine",
    "crates/dat0-format",
    "crates/dat0-fixtures",
    "crates/dat0-i18n",
    "crates/dat0-keychain",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/accidentally-awesome-labs/dat0"
authors = ["Accidentally Awesome Labs"]
rust-version = "1.85"

[workspace.dependencies]
# Async + utilities
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
notify = "6"
once_cell = "1"
parking_lot = "0.12"
dirs = "5"

# P3a: advisory file lock (PID + flock for AppLock singleton).
fs4 = { version = "0.9", features = ["sync"] }

# P7b: process identity (hostname + pid liveness for cross-machine lock manifest).
gethostname = "1"
libc = "0.2"

# P3a: cross-platform IPC. We use the unix-only Unix Domain Socket
# path; the crate's Windows shim ships separately (P3a is macOS+Linux only).
interprocess = { version = "2", features = ["tokio"] }

# P3a: UUID v7 (time-ordered) for stable window IDs.
uuid = { version = "1", features = ["v7"] }

# P3a: LRU cache for paged Arrow batches in GridDataSource.
lru = "0.12"

# GPUI (verified pins per docs/internal/gpui-api-notes.md, T0 finding 2026-04-26).
# gpui/gpui-macros are now published to crates.io as of v0.2.0 (PR #39835); v0.2.2 publish
# commit is zed-industries/zed @ 08d95ad9d31f616a43dacda8416568d658dca6ae. gpui-component
# v0.5.1 itself declares `gpui = "0.2.2"` in its workspace Cargo.toml — i.e. the upstream
# component crate consumes gpui as a published crate, not as a git dep on
# zed-industries/zed. We mirror that here with exact-version pins (`=0.2.2`) plus the SHA
# recorded in docs/upstream-watch.md for traceability.
gpui = "=0.2.2"
# Workspace-pinned for version traceability; not currently a direct dep
# (transitively resolved via gpui). T14 may add direct usage if `actions!`
# turns out to be re-exported through gpui-macros at the pinned version.
gpui-macros = "=0.2.2"
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "0f0ab35233212f8f3277028995caf0c41e13ee6c" }

# Telemetry
sentry = { version = "0.36", default-features = false, features = ["backtrace", "panic", "rustls", "reqwest"] }
regex = "1"

# HTTP (used by updater module for appcast smoke checks)
ureq = { version = "2", default-features = false, features = ["tls"] }

# P3b T8: async HTTP for sample-data fetch (NYC taxi parquet). rustls only —
# no native-tls leak (verified at T8). `stream` feature kept for future
# chunked-download progress UI; current fetch_remote buffers the body whole.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

# P3b T8: SHA-256 over the downloaded blob before atomic-rename into the
# samples cache.
sha2 = "0.10"

# P8 T1: `.dat0` package container. Pin proven by the P8 T0 spike
# (docs/internal/2026-06-13-p8-spike-notes.md §S2): default-features off drops
# the heavy zstd/lzma/xz/bzip2 codecs we don't need; `deflate-flate2-zlib-rs`
# selects the pure-Rust zlib backend (the bare `deflate-flate2` feature fails to
# compile — "No compression backend selected"). Stored Parquet + Deflated JSON.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# P8 T1: validate a serialized manifest against the published JSON Schema (dev/test only).
jsonschema = "0.36"

# P3b T8: dev-only HTTP mock server for sample_data_fetch tests.
mockito = "1"

# UAT-automation proof slice: snapshot/approval gate over serialized state
# (settings.toml, session.json, generated SQL, …) — the do-now tier from the
# 2026-06-29 UAT-automation research. Text/serialized only; no pixel diffing.
insta = "1"

# UAT Gap 2 (AccessKit content-assertion): TEST-ONLY, feature-gated a11y tree
# emission read by kittest. gpui =0.2.2 pulls NO accesskit → purely additive
# (confirmed via `cargo tree -i accesskit`). accesskit/accesskit_consumer are
# OPTIONAL deps of dat0-app behind the `a11y-capture` feature; kittest is a
# dev-dep. kittest 0.3.0 is the newest release compatible with rust-version 1.85
# (0.4.0 requires rustc 1.92). The accesskit versions MUST match the ones kittest
# 0.3.0 consumes (accesskit 0.21, accesskit_consumer 0.30) — otherwise our
# hand-built `TreeUpdate` is a different type than `kittest::State::new` expects
# and the round-trip won't compile (Task-1 finding: the design's 0.24/0.35 pins
# were for kittest 0.4, which needs rustc 1.92). Single accesskit copy per crate.
# This does NOT close D-015 (production a11y).
accesskit = "0.21"
accesskit_consumer = "0.30"
kittest = "0.3.0"

# Bench
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

# P9a Charts: plotters renders the 7 chart types to a bitmap buffer (BGRA→GPUI
# img) + PNG/SVG export. plotters core+svg were transitive (via criterion);
# plotters-bitmap (bitmap_backend/bitmap_encoder) is genuinely new here. Promoted
# to a first-class dep by the P9a-1 T0 spike.
# GOTCHA (T0 finding): plotters 0.3.7 declares `colormaps = []` (no feature dep)
# yet `style/colors/colormaps.rs` unconditionally does `use super::full_palette::*`
# — so `colormaps` WITHOUT `full_palette` is a compile error (E0432). The crate's
# own `default` set always pairs them; we mirror that by enabling `full_palette`
# (it is a pure-data feature, `full_palette = []`, no extra deps).
plotters = { version = "0.3.7", default-features = false, features = [
    "bitmap_backend", "bitmap_encoder", "svg_backend",
    "all_series", "all_elements", "colormaps", "full_palette", "ttf",
] }

# Dev / test utilities
tempfile = "3"
serial_test = "3"

# Engine: DuckDB native + bundled extensions (json, parquet are statically linked under `bundled`).
# CSV reading is in DuckDB core; sqlite_scanner is NOT bundled (see D-009) and is loaded at runtime.
# Arrow types are consumed via duckdb::arrow re-exports — DO NOT add a standalone `arrow` dep.
duckdb = { version = "=1.4.4", features = ["bundled", "json", "parquet"] }

# Streaming
futures = "0.3"

# Trait async helpers
async-trait = "0.1"

# CPU count probe (engine threads pragma)
num_cpus = "1"

# Fixtures generator (T12): deterministic CSV/Parquet/SQLite from a seed.
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3" # deterministic PRNG (cross-platform reproducibility)
rusqlite = { version = "0.31", features = ["bundled"] }

# Internal crates
dat0-engine = { path = "crates/dat0-engine" }
dat0-format = { path = "crates/dat0-format" }
dat0-i18n = { path = "crates/dat0-i18n" }
dat0-keychain = { path = "crates/dat0-keychain" }

# CI disk/RAM mitigation (docs/ci.md "OOM mitigations" knob #1): trim dev/test
# debuginfo to line tables only. The dev-profile link of dat0's test-binary set
# (duckdb + arrow + gpui + sentry) carries full DWARF that exhausted the hosted
# ubuntu runner's ~14 GB disk once P8 added ~9 more test binaries. `test`
# inherits `dev`'s debug, so this shrinks every test binary ~60%. Tradeoff:
# panic backtraces keep line numbers but lose inlined frames — acceptable.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.bench]
debug = true
