name: Bug report
description: Report a reproducible problem with dat0.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report vulnerabilities or data leaks here.** Use [private security reporting](https://github.com/accidentally-awesome-labs/dat0/security/advisories/new) or security@dat0.app.
        Use minimal synthetic data, never real private datasets. Remove credentials and private information from logs and screenshots.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which dat0 version or commit did you use?
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, OS version, and architecture.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include minimal steps and synthetic input if needed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Optional sanitized logs or screenshots. Review every attachment for private data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have removed credentials and private data from this report and its attachments.
          required: true
