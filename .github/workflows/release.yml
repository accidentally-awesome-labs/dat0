name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}   # dry run: builds + verifies, skips publish

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.100.0
        with: { targets: aarch64-apple-darwin,x86_64-apple-darwin }
      - run: brew install create-dmg
      - name: Import Developer ID cert
        env:
          CERT_P12: ${{ secrets.APPLE_DEV_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
      - name: Notary API key file
        env: { AC_API_KEY_P8: "${{ secrets.AC_API_KEY_P8 }}" }
        run: echo "$AC_API_KEY_P8" | base64 --decode > /tmp/ac_api_key.p8
      - name: Bundle + sign + notarize
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
          AC_KEY_ID: ${{ secrets.AC_KEY_ID }}
          AC_ISSUER_ID: ${{ secrets.AC_ISSUER_ID }}
          AC_API_KEY_PATH: /tmp/ac_api_key.p8
        run: |
          SHA=$(git rev-parse --short HEAD)
          cargo xtask gen-icon
          cargo xtask bundle-macos --version "${VERSION#v}" --git-sha "$SHA"
          cargo xtask sign-macos --identity "${{ secrets.DAT0_SIGN_IDENTITY }}"
          cargo xtask verify --macos
      # Artifact filenames stay unversioned: the publish job below and
      # xtask::sign::verify both address them by fixed path. The version is
      # applied when the assets are staged for the GitHub Release.
      - uses: actions/upload-artifact@v4
        with: { name: dat0-dmg, path: target/macos/dat0.dmg }
      - uses: actions/upload-artifact@v4
        with: { name: dat0-app-tarball, path: target/macos/dat0.app.tar.gz }

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Tools
        run: |
          sudo apt-get update
          # libfuse2 + fuse run the AppImage; desktop-file-utils is
          # appimagetool's desktop-file-validate. The rest are the webview +
          # keychain BUILD dependencies ci.yml's "Linux deps" step declares
          # mandatory — xtask/src/linux.rs runs `cargo build -p dat0-ui
          # --release` here, and without them the release build dies at link
          # time on webkit2gtk/libsecret/pango/xkbcommon/fontconfig/openssl.
          sudo apt-get install -y \
            libfuse2 fuse desktop-file-utils \
            libsecret-1-dev libpango1.0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libssl-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libxdo-dev
          # Into $RUNNER_TEMP, not /usr/local/bin: that directory is not
          # writable by the runner user, so the original un-sudo'd
          # `wget -O /usr/local/bin/appimagetool` failed with EACCES. The
          # basename must stay `appimagetool` — xtask/src/linux.rs invokes it
          # by bare name.
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          # linuxdeploy bundles the binary's non-excluded shared objects into
          # the AppDir and writes AppRun. Same install shape and same
          # bare-basename requirement as appimagetool above — xtask/src/linux.rs
          # invokes it as `linuxdeploy`.
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O "$RUNNER_TEMP/linuxdeploy"
          chmod +x "$RUNNER_TEMP/linuxdeploy"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          # Required for `--pinentry-mode loopback` in the sign step
          # (docs/release-runbook.md option (b)). Harmless for the recommended
          # passphraseless CI subkey, which never reaches the agent for a PIN.
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --reload gpg-agent || true
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Bundle + sign
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
          # THE fix for the P10a passphrase trap: step-scoped `env:` does not
          # propagate, so declaring GPG_PASSPHRASE on the import step above (as
          # this workflow used to) left the signing step with nothing. xtask
          # reads DAT0_GPG_PASSPHRASE and, when it is empty or unset, omits
          # `--pinentry-mode loopback --passphrase-fd 0` entirely — the
          # passphraseless CI subkey that docs/security-runbook.md recommends
          # would FAIL if those flags were always passed.
          DAT0_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          # Both linuxdeploy and appimagetool ARE AppImages. Extracting instead
          # of FUSE-mounting them is the standard CI posture — it survives a
          # runner image without a usable /dev/fuse, which is otherwise an
          # opaque "failed to set up mount namespace" at bundle time.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          cargo xtask gen-icon
          cargo xtask bundle-linux --version "${VERSION#v}"
      - name: Verify on clean Ubuntu
        run: |
          docker run --rm -v "$PWD/target/linux:/art" ubuntu:24.04 bash -euc '
            # The AppImage excludelist deliberately does NOT bundle the core
            # desktop libraries; the format declares them the responsibility of
            # the host system. A genuinely bare container therefore cannot run
            # ANY AppImage, and testing in one would prove nothing about dat0.
            # Installing exactly that baseline and nothing else keeps the gate
            # sharp: every dat0-specific dependency (libssl, libpango,
            # libxkbcommon, libsecret, and DuckDB own deps) must come from the
            # AppDir that linuxdeploy populated, or this step fails.
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              ca-certificates zlib1g libstdc++6 \
              libfontconfig1 libfreetype6 libglib2.0-0t64 \
              libx11-6 libxext6 libxcb1 libxau6 libxdmcp6 \
              libgl1 libegl1 \
              libwebkit2gtk-4.1-0 libsoup-3.0-0
            cd /art
            ./dat0.AppImage --appimage-extract >/dev/null
            ./squashfs-root/AppRun --version
          '
          cargo xtask verify --linux
      - uses: actions/upload-artifact@v4
        with: { name: dat0-appimage, path: 'target/linux/dat0.AppImage*' }

  publish:
    needs: [macos, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Stage release assets under their versioned names
        # `gh release`'s asset name is the file's basename — there is no rename
        # flag — so the version is applied by copying, here, at upload time.
        # The originals under dist/ are left in place because the manifest step
        # below addresses them by fixed path.
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p upload
          cp dist/dat0-dmg/dat0.dmg                "upload/dat0-${V}-universal.dmg"
          cp dist/dat0-appimage/dat0.AppImage      "upload/dat0-${V}-x86_64.AppImage"
          cp dist/dat0-appimage/dat0.AppImage.sig  "upload/dat0-${V}-x86_64.AppImage.sig"
          # The updater artefact keeps its plain name: xtask/src/manifest.rs
          # points latest.json's macOS URL at `.../v{version}/dat0.app.tar.gz`.
          cp dist/dat0-app-tarball/dat0.app.tar.gz upload/dat0.app.tar.gz
          ls -l upload
      - name: Checksums
        # Explicit operands, not a glob: a bare `*` would race the SHA256SUMS
        # file the redirect creates in the same directory.
        run: |
          V="${GITHUB_REF_NAME#v}"
          cd upload && sha256sum \
            "dat0-${V}-universal.dmg" \
            "dat0-${V}-x86_64.AppImage" \
            "dat0-${V}-x86_64.AppImage.sig" \
            dat0.app.tar.gz > SHA256SUMS
      - name: Generate + sign update manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          TARBALL=dist/dat0-app-tarball/dat0.app.tar.gz
          APPIMAGE=dist/dat0-appimage/dat0.AppImage
          MACOS_SHA=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          MACOS_SIZE=$(stat -c%s "$TARBALL")
          LINUX_SHA=$(sha256sum "$APPIMAGE" | cut -d' ' -f1)
          LINUX_SIZE=$(stat -c%s "$APPIMAGE")
          cargo xtask gen-manifest \
            --version "${GITHUB_REF_NAME#v}" \
            --macos-sha "$MACOS_SHA" \
            --macos-size "$MACOS_SIZE" \
            --linux-sha "$LINUX_SHA" \
            --linux-size "$LINUX_SIZE"
          cargo install rsign2 --locked
          printf '%s' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          # CI key is PASSWORDLESS (no passphrase env needed — avoids the P10a GPG-passphrase-in-CI trap)
          rsign sign -s /tmp/minisign.key -x target/latest.json.minisig target/latest.json
          rm -f /tmp/minisign.key
      - name: Publish to GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "${{ github.ref_name }}" --generate-notes \
            "upload/dat0-${V}-universal.dmg" \
            "upload/dat0-${V}-x86_64.AppImage" \
            "upload/dat0-${V}-x86_64.AppImage.sig" \
            upload/SHA256SUMS
          gh release upload "${{ github.ref_name }}" \
            target/latest.json \
            target/latest.json.minisig \
            upload/dat0.app.tar.gz
