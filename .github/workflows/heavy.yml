name: Heavy tests
# Exit-criterion tests gated by `#[ignore = "requires generated fixtures"]`.
# Run on a schedule + manually + on PRs labelled `run-heavy`. Kept off the
# per-push CI path because fixture generation (1 GB CSV + 500 MB Parquet +
# 100 MB SQLite) plus end-to-end execution dominates billable minutes.
on:
  # WEEKLY, not nightly. The original justification for disabling cron
  # entirely was "solo-dev + pre-P3 + low PR frequency": a nightly run would
  # burn ~45m of runner time on most days with no engine or fixture change to
  # validate. That argument is about CADENCE, not about whether the heaviest
  # gate in the repo should be human-triggered — and leaving it human-
  # triggered means it silently stops running the moment someone forgets the
  # label. Weekly answers the cost objection (one run instead of seven) while
  # putting a floor under drift detection. Monday 06:00 UTC so a regression
  # surfaces at the start of a working week, not the end of one.
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: heavy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # See ci.yml for the full rationale. Incremental caches are written, never
  # reused (every CI run is a clean build) and cost GBs of disk — a real hazard
  # on the hosted Ubuntu runner, which has already died with `No space left on
  # device`. Heavy runs additionally generate ~1.6 GB of fixtures, so the
  # headroom matters even more here. Build-cache only: no compiled-output change.
  CARGO_INCREMENTAL: 0

jobs:
  exit-criteria:
    # Skip on PRs unless explicitly labelled. Schedule + manual + push always run.
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-heavy')
    # Temporarily routed to hosted ubuntu-latest while the self-hosted runnerkit
    # host is offline — mirrors ci.yml's temporary reroute so this job actually
    # runs instead of sitting `queued`. Restore the `[self-hosted, Linux,
    # runnerkit]` label once the host is back. Linux x86_64 only — see ci.yml
    # notes on linux-arm64 deferral. Fixtures are GENERATED in-job
    # (dat0-fixtures, seed 42), not downloaded, so no release-asset dependency.
    runs-on: ubuntu-latest
    # Fixture generation (~15-20 min on a cache miss) plus the release
    # duckdb-bundled build plus the exit-criteria suite; 90 leaves headroom
    # over the observed ~45m while still catching a hang well before GitHub's
    # 6-hour default burns a weekly run's worth of minutes.
    timeout-minutes: 90
    env:
      DAT0_GLITCHTIP_DSN_PUBLIC: ${{ secrets.GLITCHTIP_DSN_PUBLIC }}
      # Cap link parallelism: default 4-job `ld` OOMs (Bus error / signal 7) on
      # hosted ubuntu-latest's 16 GB RAM during the release duckdb-bundled link
      # (P3b CI saga). Harmless if the job is ever re-pinned to self-hosted.
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5
      # Hosted ubuntu-latest ships ~14 GB free; fixture generation (1 GB CSV +
      # 500 MB Parquet + 100 MB SQLite) plus the release duckdb-bundled build
      # overruns it. Free ~30 GB (P3b CI-saga mitigation). Skipped if this job
      # is ever re-pinned to the self-hosted runnerkit host (operator-managed).
      - name: Free disk space (hosted Linux only)
        if: runner.environment == 'github-hosted'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-unknown-linux-gnu
      # Skipped on self-hosted (runnerkit images lack NOPASSWD sudo).
      # Host must have these packages pre-installed and dbus/gnome-keyring
      # as user services. See docs/ci.md.
      - name: Linux deps (webview + keychain + charts)
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsecret-1-dev dbus-x11 gnome-keyring \
            libpango1.0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libssl-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libxdo-dev
      - name: Start dbus + gnome-keyring (Secret Service backend)
        if: runner.environment == 'github-hosted'
        run: |
          eval "$(dbus-launch --sh-syntax)"
          eval "$(printf '\n' | gnome-keyring-daemon --unlock --start --components=secrets)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> $GITHUB_ENV
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
      - name: Build engine + fixtures
        run: cargo build --release -p dat0-engine -p dat0-fixtures
      - name: Cache fixtures
        id: cache-fixtures
        uses: actions/cache@v5
        with:
          path: tests/fixtures/large/
          key: fixtures-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/dat0-fixtures/**') }}-seed-42
      - name: Generate fixtures (if cache miss)
        if: steps.cache-fixtures.outputs.cache-hit != 'true'
        run: |
          mkdir -p tests/fixtures/large
          cargo run --release -p dat0-fixtures -- --out tests/fixtures/large --seed 42
      - name: Prime sqlite_scanner extension cache (avoid concurrent INSTALL race)
        run: |
          cargo run --release -p dat0-fixtures -- --out /tmp/dat0-prime --csv-bytes 4096 --sqlite-target-bytes 4096 || true
          cargo test -p dat0-engine --test attach_dispatch -- --nocapture || true
      - name: Run exit_criteria
        id: exit_criteria
        # `tee` keeps the live log while capturing the tail for the summary.
        # A weekly cron run nobody clicks into is a run nobody reads; the job
        # summary is what shows up in the Actions list.
        run: |
          set -o pipefail
          cargo test -p dat0-engine --test exit_criteria -- --include-ignored \
            2>&1 | tee /tmp/exit_criteria.log
      - name: Summarize exit_criteria
        if: always()
        run: |
          {
            echo "## Heavy exit-criteria (${{ github.event_name }})"
            echo ""
            echo "Result: **${{ steps.exit_criteria.outcome }}**"
            echo ""
            echo '```'
            tail -n 40 /tmp/exit_criteria.log 2>/dev/null || echo "(no log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  view-regen-bench:
    # P4a perf gate — 1M-row Filter < 500 ms p95 (linux-x86 leg).
    # Routed to hosted ubuntu-latest (not the self-hosted runnerkit) because
    # the bench is self-contained (gen_filter_fixture builds its own 1M-row
    # CSV in-test) and does not need the 1.6 GB exit-criteria fixture cache.
    # Keeping it hosted decouples the bench from runnerkit availability.
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-heavy')
    runs-on: ubuntu-latest
    # Criterion bench + a 1M-row in-test fixture build. Backstop only.
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space (hosted Linux only)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Linux deps (libduckdb-sys build)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - name: view_regen bench (P4a perf gate — 1M-row Filter < 500 ms p95)
        run: cargo bench -p dat0-engine --bench view_regen 2>&1 | tee /tmp/p4a_view_regen_linux.log
      - name: Upload bench log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4a-view-regen-linux
          path: /tmp/p4a_view_regen_linux.log
