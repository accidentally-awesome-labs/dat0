name: PD-004 diagnose (keychain on Linux)

# DIAGNOSTIC INSTRUMENT, not a gate. Manual dispatch only.
#
# The Linux native Secret Service round trip is explicitly opted in because it
# needs an unlocked keyring session. Compare ci.yml's dbus-launch setup (arm A)
# with dbus-run-session (arm B), retaining the captured errors as evidence.
# Post sanitized results to the relevant public issue; see docs/ci.md.
# Do not remove the native-test ignore solely on a green diagnostic run without
# making the ordinary Linux CI path exercise the same setup.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  keychain-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ca36e3307eb02aaffd8a9268ae90e586fd4f461e # 1.97.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-targets: true
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev dbus-x11 gnome-keyring libssl-dev
      # ── Arm A: exactly what ci.yml does today (env exported across steps).
      - name: 'Arm A — ci.yml setup: dbus-launch + $GITHUB_ENV propagation'
        run: |
          eval "$(dbus-launch --sh-syntax)"
          eval "$(printf '\n' | gnome-keyring-daemon --unlock --start --components=secrets)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> $GITHUB_ENV
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
      - name: 'Arm A — run the ignored keychain test'
        id: arm_a
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test -p dat0-keychain --test round_trip -- \
            --include-ignored --nocapture --test-threads=1 \
            2>&1 | tee /tmp/pd004-arm-a.log
      # ── Arm B: PD-004's own suggested fix (a) — one self-contained session
      # bus wrapping the daemon AND the test in a single invocation.
      - name: 'Arm B — dbus-run-session (PD-004 suggested fix a)'
        id: arm_b
        continue-on-error: true
        run: |
          set -o pipefail
          dbus-run-session -- bash -c '
            gnome-keyring-daemon --unlock --start --components=secrets <<<"" >/dev/null
            cargo test -p dat0-keychain --test round_trip -- \
              --include-ignored --nocapture --test-threads=1
          ' 2>&1 | tee /tmp/pd004-arm-b.log
      - name: Summarize
        if: always()
        run: |
          {
            echo "## PD-004 diagnosis"
            echo ""
            echo "| arm | setup | outcome |"
            echo "|---|---|---|"
            echo "| A | ci.yml dbus-launch + \$GITHUB_ENV | ${{ steps.arm_a.outcome }} |"
            echo "| B | dbus-run-session (fix a) | ${{ steps.arm_b.outcome }} |"
            echo ""
            echo "### Arm A tail"
            echo '```'
            tail -n 40 /tmp/pd004-arm-a.log 2>/dev/null || echo "(no log)"
            echo '```'
            echo "### Arm B tail"
            echo '```'
            tail -n 40 /tmp/pd004-arm-b.log 2>/dev/null || echo "(no log)"
            echo '```'
            echo ""
            echo "Post the failing arm's sanitized error and run URL to the relevant public issue."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pd004-diagnose-${{ github.sha }}
          path: |
            /tmp/pd004-arm-a.log
            /tmp/pd004-arm-b.log
          retention-days: 30
          if-no-files-found: warn
