name: NOTICE drift check
on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "NOTICE.md"
      - "about.toml"
      - "docs/about-template.hbs"
jobs:
  notice:
    # HARD GATE since QA2 (PD-003 closed).
    #
    # PD-003 was that `cargo about generate` is non-deterministic ACROSS HOST
    # PLATFORMS: a dual-licensed crate (e.g. `ureq`, `Apache-2.0 OR MIT`) gets
    # a different tiebreak on macOS than on Linux, so the committed NOTICE.md
    # and a freshly-generated one disagree by a section-ordering line. The job
    # was made warn-only to stop that noise reddening PRs.
    #
    # The cause is the CROSS-PLATFORM comparison, not cargo-about. The release
    # runbook already mandates regenerating NOTICE.md on Linux, so pinning the
    # generator to one canonical platform makes the diff deterministic and the
    # gate honest — PD-003's own "suggested fix (b)". `about.toml` still lists
    # all four targets, so the CONTENT is still the union across platforms;
    # only the tiebreak host is fixed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
      # Prebuilt binary rather than `cargo install --locked`: the from-source
      # build was several minutes of the job's wall time, and a `cargo install`
      # resolving its own dep graph is one more source of drift in a job whose
      # entire purpose is determinism.
      #
      # Pinned, and pinned in one place — scripts/notice-regen.sh — because an
      # unpinned install took whatever cargo-about was newest that day, so the
      # gate's output could change with no change to this repository.
      - name: cargo-about version
        id: pin
        run: echo "version=$(sed -n 's/^CARGO_ABOUT_VERSION=//p' scripts/notice-regen.sh)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@${{ steps.pin.outputs.version }}
      - name: Regenerate NOTICE.md
        run: ./scripts/notice-regen.sh "$RUNNER_TEMP/NOTICE.md"
      - name: Diff NOTICE
        run: |
          if ! diff NOTICE.md "$RUNNER_TEMP/NOTICE.md"; then
            echo "::error::NOTICE.md is out of sync with the dependency graph."
            echo "The regenerated NOTICE.md is attached to this run as an artifact:"
            echo "commit it over NOTICE.md, or run scripts/notice-regen.sh on Linux."
            echo "Do not regenerate on macOS: its dual-license tiebreak differs (PD-003)."
            exit 1
          fi
          echo "NOTICE in sync"
      # So a drifted NOTICE is one download to fix from any machine, including
      # a Mac that cannot produce the Linux tiebreak, and a Dependabot PR,
      # which cannot regenerate anything itself.
      - name: Attach the regenerated NOTICE.md
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: NOTICE.md
          path: ${{ runner.temp }}/NOTICE.md
          retention-days: 14
