name: NOTICE drift check
on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "NOTICE.md"
      - "about.toml"
      - "docs/about-template.hbs"
jobs:
  notice:
    # HARD GATE since QA2 (PD-003 closed).
    #
    # PD-003 was that `cargo about generate` is non-deterministic ACROSS HOST
    # PLATFORMS: a dual-licensed crate (e.g. `ureq`, `Apache-2.0 OR MIT`) gets
    # a different tiebreak on macOS than on Linux, so the committed NOTICE.md
    # and a freshly-generated one disagree by a section-ordering line. The job
    # was made warn-only to stop that noise reddening PRs.
    #
    # The cause is the CROSS-PLATFORM comparison, not cargo-about. The release
    # runbook already mandates regenerating NOTICE.md on Linux, so pinning the
    # generator to one canonical platform makes the diff deterministic and the
    # gate honest — PD-003's own "suggested fix (b)". `about.toml` still lists
    # all four targets, so the CONTENT is still the union across platforms;
    # only the tiebreak host is fixed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.100.0
      # Prebuilt binary rather than `cargo install --locked`: the from-source
      # build was several minutes of the job's wall time, and a `cargo install`
      # resolving its own dep graph is one more source of drift in a job whose
      # entire purpose is determinism.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Regenerate third-party list
        run: cargo about generate -c about.toml docs/about-template.hbs > /tmp/third-party.txt
      - name: Diff NOTICE
        run: |
          ./scripts/notice-extract.sh NOTICE.md > /tmp/notice-current.txt
          if ! diff /tmp/notice-current.txt /tmp/third-party.txt; then
            echo "::error::NOTICE.md is out of sync with the dependency graph."
            echo "Regenerate ON LINUX (the canonical tiebreak host this gate uses):"
            echo "  cargo about generate -c about.toml docs/about-template.hbs"
            echo "then replace the marked section in NOTICE.md. Regenerating on macOS"
            echo "will produce a different dual-license tiebreak and fail this gate again."
            exit 1
          fi
          echo "NOTICE in sync"
