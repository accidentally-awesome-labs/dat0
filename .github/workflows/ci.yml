name: CI
on:
  push:
    branches: [main]
  pull_request:
    # `labeled` is REQUIRED for the `run-perf` gate below to be reachable.
    # The default set is [opened, synchronize, reopened]; without `labeled`,
    # applying the label to an existing PR triggers nothing, and re-running the
    # workflow re-evaluates `if:` against the ORIGINAL event payload — which
    # does not carry the new label. This is the same trigger heavy.yml uses for
    # `run-heavy`.
    #
    # COST, stated plainly: any label change on a PR now re-runs this whole
    # workflow, and because `cancel-in-progress` is on, labelling mid-run
    # cancels and restarts it. Apply `run-perf` / `run-heavy` BEFORE or WITH
    # the push you want them to cover.
    types: [opened, synchronize, reopened, labeled]

# Cancel in-progress runs on the same branch/PR when a new commit lands.
# Stops minute-stacking from rapid-fire pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Incremental compilation is pure waste in CI and a real disk hazard here.
  # It only accelerates *re*builds within a persistent target dir; every CI run
  # starts clean, so the incremental caches are written, never reused, and then
  # thrown away — while consuming GBs (locally `target/debug/incremental` alone
  # reaches ~20 GB). Combined with duckdb's ~1.6 GB rlib and the
  # integration-test binaries (~200-250 MB each), that pushed the hosted Ubuntu
  # runner over its disk limit: the runner PROCESS itself died with
  # `System.IO.IOException: No space left on device` mid-step, failing an
  # otherwise-green post-merge main run (b55758b) even though Build + Test +
  # MotherDuck had all passed. `Free disk space` is already maxed out, so the
  # only remaining lever is producing less.
  #
  # This is a build-CACHE setting: it changes no compiled output, so panic
  # backtraces and the crash-e2e assertions are unaffected. (`[profile.dev]
  # debug = "line-tables-only"` in Cargo.toml already minimises debuginfo —
  # dropping it further would degrade backtraces for no comparable win.)
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with: { components: rustfmt }
      # Registry + git + target caching. `fmt` compiles nothing, but the
      # registry/git half still removes the DuckDB + Dioxus source fetch from
      # every run, which is most of this job's wall time.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with: { components: clippy }
      # `--all-targets` on Linux now compiles the webview stack's `-sys` build
      # scripts, which pkg-config against glib/gtk/soup. Before the Dioxus
      # migration this job needed no system libraries at all; it does now, and
      # without them it fails at `glib-sys` long before it lints anything.
      - name: Linux deps (webview + keychain + charts)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsecret-1-dev dbus-x11 \
            libpango1.0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libssl-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libxdo-dev
      # `clippy --all-targets` is a full check build; target caching is the
      # whole point here. This job has no disk ceiling problem (it never
      # produces the debug test-binary set that `build-and-test` does).
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # Per-PR matrix kept narrow on purpose. Heavier coverage runs in
        # heavy.yml on a schedule (and on demand via `run-heavy` PR label).
        # macos-13 (Intel): D-006 — oversubscribed runner pool.
        # linux-arm64: moved to heavy.yml — adds ~30% minutes for marginal
        #   coverage delta vs linux-x86_64. Re-add if a real arm-Linux user
        #   surfaces.
        # `labels` is an array of runner labels. Hosted runners use a single
        # built-in label (e.g. `macos-14`). Self-hosted uses the registered
        # label set. `runs-on: ${{ fromJSON(...) }}` AND-matches all labels.
        target:
          - { labels: '["macos-14"]',                              triple: aarch64-apple-darwin,     name: macos-arm64  }
          # Temporarily routed back to ubuntu-latest while runnerkit host
          # is recovered (disk exhaustion 2026-05-26 on PR #5). Re-route to
          # runnerkit labels once host is restored. Billing impact: Linux
          # = 1x multiplier, ~1h per PR — manageable short-term.
          - { labels: '["ubuntu-latest"]',                         triple: x86_64-unknown-linux-gnu, name: linux-x86_64 }
    runs-on: ${{ fromJSON(matrix.target.labels) }}
    # Backstop against a hung step burning to GitHub's 6-hour default. The
    # OpenRouter soft-gate step did exactly that twice on PR #49 (its SSE stream
    # stalled without closing), and because the job never finished, the REQUIRED
    # check went down with it — `continue-on-error` cannot rescue a hang. That
    # step now has its own `timeout-minutes`; this is the job-level net for any
    # OTHER step that stalls. Well clear of normal cost (Linux ~75m, macOS ~40m).
    timeout-minutes: 120
    env:
      DAT0_GLITCHTIP_DSN_PUBLIC: ${{ secrets.GLITCHTIP_DSN_PUBLIC }}
      # LINUX: drop DWARF from dev/test binaries. This is the disk fix.
      #
      # MEASURED (the #53 telemetry, same commit, same profile):
      #   macOS  DISK[after-test] target= 32G  avail=6.5G
      #   Linux  DISK[after-test] target=110G  avail=5.6G   ← 97% full
      #   Linux  DISK[after-live-ai]          avail=2.6G    ← 99% full
      # A 3.4x platform gap on identical code: on macOS debug info is NOT linked
      # into the executable (it stays in .o/dSYM), but on Linux DWARF is EMBEDDED
      # in every statically-linked (duckdb + arrow) test binary.
      # So `[profile.dev] debug = "line-tables-only"` is nearly free on macOS and
      # enormously expensive on Linux — which is why Linux finishes at 99% disk and
      # intermittently dies with `No space left on device` (it reddened main on
      # b55758b and blocked #51). CARGO_INCREMENTAL=0 (#50) and the release-tree
      # reclaim (#52) together bought only ~4 GB; this is the real lever.
      #
      # ★ MUST be JOB-level, not step-level: Prime / Test / MotherDuck / OpenRouter
      # all build dev-profile artifacts, and a profile that differs between steps
      # changes the fingerprint → a FULL REBUILD, which would make disk *worse*.
      # Uses `matrix` (not `runner`) because the `runner` context is unavailable in
      # job-level `env`. The release profile is untouched (`Build` uses --release;
      # CARGO_PROFILE_DEV_* only affects dev/test).
      #
      # COST: CI backtraces keep function names but lose file:line. Accepted
      # against a job running at 99% disk; flip this to `line-tables-only` on a
      # branch if a failure ever needs precise line numbers.
      # The DISK[after-test] telemetry reports exactly what this buys.
      #
      # ★ WAS Linux-only (`matrix.target.name == 'linux-x86_64' && '0' ||
      # 'line-tables-only'`) until UI-redesign B5. The macOS exemption rested on
      # the paragraph above — debug info is not linked into the executable on
      # macOS, so line-tables-only is "nearly free" THERE — but that argument is
      # about BINARY size, and the thing that exhausts the disk is the whole
      # `target/` tree, which also holds every `deps/*.o` those line tables live
      # in. That half was never measured on macOS; the #54 meta-lesson is to
      # measure the failing thing ON the failing platform rather than to reason
      # across from the other one.
      #
      # macOS headroom had fallen one way for four slices (A5 -0.5, B1 -0.3,
      # B5 -0.5 Gi) and B5's main run finished at DISK[after-live-ai] 4.1 Gi
      # against the 2.9 Gi that forced the #65 hotfix — with B6-B8 adding six
      # more dock panels. So #75 measured it, and the exemption was wrong by
      # more than an order of magnitude:
      #
      #                       macOS baseline (B5 PR)   macOS with debug=0 (#75)
      #   DISK[after-test]            6.2 Gi                   18 Gi
      #   DISK[after-live-ai]         4.5 Gi                   17 Gi
      #   target/ at after-test        33 G                     20 G
      #
      # ~13 G of tree, i.e. +12.5 Gi of job-end headroom, from one env var. The
      # line tables were never in the executables (the paragraph above is right
      # about that) — they were in `deps/*.o`, which is most of what `target/`
      # weighs. Linux was the CONTROL and did not move by a single reading
      # (after-test 96G avail / 20G target on both runs), and note macOS now
      # lands at the SAME 20G tree as Linux, which is what you would expect if
      # `.o` debug info was the entire difference.
      #
      # ⚠ DO NOT "fix" bench disk by adding `--target` to the bench step (a
      # lever these files carried for four slices): both DISK readings are taken
      # BEFORE the bench runs, and the bench's own `rm -rf target/<triple>` takes
      # the runner from 4.1 Gi to 38 Gi free before it compiles anything. To make
      # `--target` reuse a tree you must delete that reclaim, which is what
      # creates the 38 Gi — leaving the bench at ~4.1 Gi carrying the debug tree
      # and still rebuilding release DuckDB. That is the P5c runner death the
      # reclaim exists to prevent. See the bench steps at the end of this job.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      # GitHub-hosted ubuntu-latest ships ~14 GB free disk by default;
      # dat0's debug-profile cargo test --workspace blows past that
      # (duckdb + arrow + sentry rlib chain). Free ~30 GB by
      # removing preinstalled language tooling we don't use.
      # See docs/ci-mac-vm-runner.md / docs/ci.md for the wider disk
      # story. Skipped on self-hosted (operator manages disk there).
      - name: Free disk space (hosted Linux only)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      # Disk telemetry (see .github/scripts/disk-report.sh for the full why).
      # The runner has intermittently died with `No space left on device` and we
      # had NO disk data, so every diagnosis — including a "~100 GB debug build"
      # that turned out to be ~23 GB — was guesswork. These snapshots make the
      # LOW-WATER MARK visible on every run, including failed ones. Grep `DISK[`.
      - name: 'Disk: baseline (after reclaim action)'
        if: always()
        run: |
          echo '| phase | avail | used | target/ |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          ./.github/scripts/disk-report.sh baseline "${{ matrix.target.triple }}"
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target.triple }}
      # Registry + git caching ONLY. `cache-targets: false` is load-bearing:
      # this job deliberately `rm -rf`s `target/<triple>/release` (see the
      # "Reclaim release tree" step) and, on macOS, the whole
      # `target/<triple>` tree before the bench — it fights a disk ceiling
      # rather than a compile-time one. Caching a target dir that the job
      # then deletes would upload GBs on every run for nothing, and restoring
      # it would recreate the exhaustion the reclaims exist to prevent.
      # What the registry/git half removes is the DuckDB + Dioxus + Arrow source
      # fetch, which is pure download time with no disk-ceiling downside.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          key: ${{ matrix.target.name }}
      # nextest runs each test in its OWN PROCESS. dat0 has 21 tests using
      # `serial_test` and several that mutate process-global `OnceCell`s
      # (crates/dat0-core/src/globals.rs), so per-test process
      # isolation is not a nicety here — it is what lets those tests stop
      # serializing against each other inside one binary.
      - uses: taiki-e/install-action@nextest
      # apt + dbus-launch steps are skipped on self-hosted runners. Those
      # runners must have the listed packages pre-installed on the host image
      # (see docs/ci.md for the install command) and dbus/gnome-keyring
      # running as user services. runnerkit images do not include sudo
      # NOPASSWD, so per-job `sudo apt` fails. Hosted ubuntu-latest still
      # needs them installed in-job since the image is wiped per run.
      - name: Linux deps (webview + keychain + charts)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsecret-1-dev dbus-x11 gnome-keyring \
            libpango1.0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libssl-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libxdo-dev
      - name: Linux — start dbus + gnome-keyring (Secret Service backend)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          eval "$(dbus-launch --sh-syntax)"
          eval "$(printf '\n' | gnome-keyring-daemon --unlock --start --components=secrets)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> $GITHUB_ENV
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
      - name: Build
        run: cargo build --workspace --release --target ${{ matrix.target.triple }}
      - name: 'Disk: after Build (release)'
        if: always()
        run: ./.github/scripts/disk-report.sh after-build-release "${{ matrix.target.triple }}"
      - name: Prime sqlite_scanner extension cache (avoid concurrent INSTALL race)
        run: |
          # `--target` keeps these in the SAME target/<triple>/ trees as the Build
          # (release) + Test (debug) steps. Without it, cargo builds separate host
          # `target/{release,debug}` trees — i.e. two MORE full DuckDB compiles
          # (one debug) on disk, which exhausted the ~14 GB ubuntu runner once
          # P7a added more test binaries. Reusing the trees frees that headroom.
          cargo run --release --target ${{ matrix.target.triple }} -p dat0-fixtures -- --out /tmp/dat0-prime --csv-bytes 4096 --sqlite-target-bytes 4096 || true
          # Force a one-shot INSTALL so subsequent test-binary processes find the extension cached.
          cargo test -p dat0-engine --target ${{ matrix.target.triple }} --test attach_dispatch -- --nocapture || true
      # The release tree is DEAD WEIGHT from here on — drop it before the debug
      # test build, which is what actually exhausts the disk.
      #
      # `Build` (release) and `Test` (debug) both land in target/<triple>/, so the
      # runner carries BOTH full trees at once (each with its own ~1.6 GB duckdb
      # rlib). The last consumer of the release tree is the Prime step above
      # (`cargo run --release`); everything after this — Test, MotherDuck,
      # OpenRouter — is debug. On Linux ~7.5 GB of release artifacts just sit
      # there while the debug tree (duckdb + the workspace's test binaries)
      # balloons past the limit. The runner PROCESS itself then dies with `No
      # space left on device` mid-step — it reddened main on b55758b and blocked
      # PR #51. `Free disk space` is already maxed out and CARGO_INCREMENTAL=0
      # alone was not enough; this is the remaining lever.
      #
      # ★ Ran Linux-only until 819d068 (UI-redesign A4). That slice added ONE
      # extra debug link — the feature-gated `gallery` example, built by both
      # `clippy --all-targets` and `cargo test` — and the macOS job-end free
      # space fell 4.8 G → 2.9 G (main run 30283360033: DISK[after-test] 4.5 Gi
      # LOW-WATER, DISK[after-live-ai] 2.9 Gi). macOS has the same dead release
      # tree for the same reason, so the gate is now dropped and both platforms
      # reclaim. (At the time this was written macOS was NOT covered by
      # CARGO_PROFILE_DEV_DEBUG: 0 — that exemption was removed after B5; see the
      # job-level env above — so this reclaim was then the only headroom macOS
      # got before A5 added rust-embed assets + SVGs on top.)
      #
      # Triggers no rebuild on either platform: nothing downstream asks for
      # --release. On macOS specifically the bench runs with NO `--target`, so it
      # builds a fresh host tree in target/{debug,release} and never reuses this
      # one — and its own reclaim step already `rm -rf`s the whole target/<triple>
      # (that step still works fine against a tree missing `release/`).
      # `df` before/after makes the headroom visible in the log — we previously had
      # no way to measure it.
      - name: Reclaim release tree before the debug test build
        run: |
          ./.github/scripts/disk-report.sh before-reclaim "${{ matrix.target.triple }}"
          du -sh "target/${{ matrix.target.triple }}/release" 2>/dev/null || true
          rm -rf "target/${{ matrix.target.triple }}/release"
          ./.github/scripts/disk-report.sh after-reclaim "${{ matrix.target.triple }}"
      - name: Test (nextest)
        # `--include-ignored` deliberately omitted. Heavy exit_criteria tests
        # (1 GB CSV / 500 MB Parquet / 100 MB SQLite) run nightly via
        # heavy.yml. PR-time validation runs the fast suite only.
        #
        # nextest, not `cargo test`: it runs every test in its own process.
        # dat0 has 21 tests using `serial_test` and several that mutate
        # process-global `OnceCell`s (crates/dat0-core/src/globals.rs);
        # inside a single `cargo test` binary those must serialize against each
        # other, and a global left dirty by one test is visible to the next.
        # Per-test processes remove both hazards.
        #
        # CARGO_BUILD_JOBS caps concurrent rustc/link processes on hosted
        # Linux: ubuntu-latest has 4 vCPU + 16 GB RAM, and the dev-profile
        # link of dat0's test binary set (duckdb + arrow + sentry
        # rlib chain) OOM-kills `ld` (signal 7 Bus error) at default
        # parallelism. See docs/ci.md "OOM mitigations" §2.
        env:
          # Empty-string fallback would be re-read by cargo and rejected
          # ("could not parse ``"). Use the literal "default" for the
          # non-Linux branch so cargo treats it as the unset semantics.
          CARGO_BUILD_JOBS: ${{ (runner.os == 'Linux' && runner.environment == 'github-hosted') && '2' || 'default' }}
        run: cargo nextest run --workspace --target ${{ matrix.target.triple }}
      - name: Doctests
        # nextest does NOT run doctests (upstream: rustc has no libtest-json
        # harness for them). `cargo test --doc` is the only way to keep them
        # gated, and it reuses the tree nextest just built.
        env:
          CARGO_BUILD_JOBS: ${{ (runner.os == 'Linux' && runner.environment == 'github-hosted') && '2' || 'default' }}
        run: cargo test --workspace --target ${{ matrix.target.triple }} --doc
      # ★ THE LOW-WATER MARK. Every disk-exhaustion failure so far has struck at a
      # cargo step AFTER a green `Test` — the debug build is the peak consumer, so
      # this is the number that decides whether the job survives. `if: always()`
      # so we still capture it when a later step dies.
      - name: 'Disk: after Test (LOW-WATER MARK)'
        if: always()
        run: ./.github/scripts/disk-report.sh after-test "${{ matrix.target.triple }}"
      # P5c (D3): MotherDuck integration is a REQUIRED gate. The token is a
      # repo secret (Settings → Secrets and variables → Actions → MOTHERDUCK_TOKEN).
      # Fork PRs receive no secrets and will fail this step — acceptable for a
      # solo repo (design §7).
      - name: Require MotherDuck token
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          if [ -z "$MOTHERDUCK_TOKEN" ]; then
            echo "::error::MOTHERDUCK_TOKEN secret is required for P5c integration tests"
            exit 1
          fi
      - name: MotherDuck integration tests
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          CARGO_BUILD_JOBS: ${{ (runner.os == 'Linux' && runner.environment == 'github-hosted') && '2' || 'default' }}
        run: cargo test -p dat0-engine --test md_attach --target ${{ matrix.target.triple }} -- --include-ignored
      # P9c-1: OpenRouter AI round-trip is a REQUIRED gate (mirrors MD pattern).
      # Secret: Settings → Secrets and variables → Actions → OPENROUTER_API_KEY.
      - name: Require OpenRouter API key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY secret is required for P9c-1 AI integration tests"
            exit 1
          fi
      - name: OpenRouter AI integration tests
        # SOFT GATE (advisory, non-blocking). The live OpenRouter API is a flaky
        # third-party dependency: it intermittently returns empty responses
        # (`no choices[0].message.content` / `expected >=1 delta`), which reddened
        # main + PRs on transient outages repeatedly (P9c / P10a / P10a-2 — often
        # a DIFFERENT sub-test each run, and reruns did not clear it). Blocking a
        # required gate on a third-party outage is the wrong tradeoff. The
        # hermetic `ai::wire` unit tests in the --workspace Test step above remain
        # a HARD gate for the SSE/JSON parsing logic; this step is live smoke only.
        continue-on-error: true
        # `continue-on-error` only swallows a FAILURE — it cannot rescue a HANG.
        # Observed on PR #49: OpenRouter's SSE stream stalled without closing, so
        # `ai_live` blocked forever; the job never left this step and was killed
        # hours later, taking the REQUIRED build-and-test check down with it (once
        # as `cancelled`, once as `failure`) even though Build + Test + MotherDuck
        # had all already passed. That is precisely the "third-party outage blocks a
        # required gate" tradeoff this step is documented to avoid. Cap the step so
        # a stall fails fast and `continue-on-error` can do its job. 15m is well
        # clear of the normal cost (binary is already built by the Test step above;
        # the two serialized live calls take seconds).
        timeout-minutes: 15
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CARGO_BUILD_JOBS: ${{ (runner.os == 'Linux' && runner.environment == 'github-hosted') && '2' || 'default' }}
        # ai_live tests are `#[ignore]`d (live API) so the --workspace Test step
        # above stays hermetic; --include-ignored runs them HERE.
        # --test-threads=1 serializes the two live calls so they don't fire
        # simultaneously against the per-key rate window.
        run: cargo test -p dat0-core --test ai_live --target ${{ matrix.target.triple }} -- --include-ignored --test-threads=1 --nocapture
      # This is the exact step the runner has died on (disk-full, mid-step, leaving
      # it `in_progress/null` — deceptively hang-like). Snapshot here to see how
      # much headroom was actually left at the moment of death.
      - name: 'Disk: after live-AI step'
        if: always()
        run: ./.github/scripts/disk-report.sh after-live-ai "${{ matrix.target.triple }}"
      # Perf harness is macOS-only (single host class — variance across
      # runners makes cross-OS comparison meaningless).
      #
      # ADVISORY on purpose (`continue-on-error: true`). This runner is a
      # virtualized macOS VM with no dedicated GPU; a frame-interval budget
      # measured there cannot honestly defend a frame-rate claim, and a gate
      # that reddens main on runner variance is worse than no gate at all —
      # it trains everyone to ignore it. What this step IS for: recording the
      # `ci-hosted` host's numbers on every merge so drift is visible.
      # `--check` on a host with no entry in docs/internal/perf-baselines.json
      # RECORDS rather than compares (see the MX2 decision table), so the
      # first run here is informational by construction.
      # The BLOCKING gate is the `perf-gate` job below.
      #
      # Gated to push events (i.e. merges to main), NOT pull_request: the
      # harness builds `--release --features perf-harness` plus the plain
      # `dat0` binary in a THIRD profile on top of the debug (Test) + release
      # (Build) trees, which exhausted the macOS runner's ~14 GB disk on P5c
      # PR runs ("No space left on device" in libduckdb-sys ranlib), failing
      # the whole job — and a disk-dead runner can't be rescued by
      # continue-on-error.
      #
      # The reclaim below is therefore mandatory, not an optimization: the
      # harness build has no `--target`, so cargo builds a FRESH host tree in
      # `target/{debug,release}` and never reuses `target/<triple>`. Dropping
      # that tree (unused from here on; MotherDuck tests already ran) frees
      # both prior DuckDB builds first.
      - name: Reclaim disk before perf harness (macOS, push to main)
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: |
          df -h /
          rm -rf "target/${{ matrix.target.triple }}"
          df -h /
      - name: Perf harness — advisory check (macOS only, push to main)
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          # Keys the baseline entry. Without it a virtualized runner would be
          # compared against dev-box numbers, which is the comparison MX2's
          # host key exists to prevent.
          DAT0_PERF_HOST: ci-hosted
        run: |
          cargo xtask perf --check \
            --scenario scroll_1m \
            --scenario cold_launch \
            --scenario idle_rss \
            | tee perf-check.jsonl
      - name: Upload perf artifact
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: perf-check-${{ github.sha }}
          path: perf-check.jsonl
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────
  # BLOCKING perf gate. Opt-in per PR via the `run-perf` label, exactly like
  # heavy.yml's `run-heavy`, because the six-scenario run costs ~30-40 min of
  # 10x-billed macOS minutes and most PRs cannot move frame time.
  #
  # No `continue-on-error`: this is the gate. When dedicated (non-virtualized)
  # macOS hardware appears, the ONLY line that changes is `runs-on:` — the
  # command, the budgets and the host key stay as they are. Promoting this from
  # label-triggered to every-PR is tracked as its own deferral.
  perf-gate:
    name: Perf budget (run-perf label)
    # Label-gated only. Unlike heavy.yml this does NOT run on push: the
    # advisory step inside `build-and-test` already covers post-merge main.
    if: >
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run-perf')
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: cargo xtask perf --check (all six scenarios)
        env:
          DAT0_PERF_HOST: ci-hosted
        run: cargo xtask perf --check | tee perf-gate.jsonl
      - name: Upload perf artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-${{ github.sha }}
          path: perf-gate.jsonl
          retention-days: 14

  # Coverage is REPORTING ONLY — deliberately no threshold. A threshold picked
  # before the number is known is a guess; docs/ci.md records the measured
  # figure from the first run, and that measured figure becomes the floor of a
  # later ratchet.
  #
  # This job could not run at all until the `CARGO_PROFILE_DEV_DEBUG` below.
  # It died every time with `No space left on device` — not a test failure, the
  # runner itself could not write its own diagnostic log, so no logs survived
  # to say so. `libduckdb-sys` alone is a 1.6 GB rlib and the workspace builds
  # 190 integration-test binaries against it; instrumenting all of that on top
  # of a debug build the `build-and-test` job already calls its low-water mark
  # was never going to fit.
  #
  # Debug info is what made it not fit, and coverage does not need it: llvm-cov
  # takes line numbers from the coverage map `-C instrument-coverage` emits, not
  # from DWARF. Measured locally on the whole workspace — 21 GB of target dir
  # against 64 GB for the ordinary debug build, and the report is undiminished:
  # 19 789 line records over 194 files, 8 005 functions, 84.9% lines.
  coverage:
    name: Coverage (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with: { components: llvm-tools-preview }
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - name: Linux deps (webview + keychain + charts)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsecret-1-dev dbus-x11 gnome-keyring \
            libpango1.0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libssl-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libxdo-dev
      - name: Start dbus + gnome-keyring (Secret Service backend)
        run: |
          eval "$(dbus-launch --sh-syntax)"
          eval "$(printf '\n' | gnome-keyring-daemon --unlock --start --components=secrets)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> $GITHUB_ENV
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: cargo llvm-cov
        env:
          # Same OOM cap as build-and-test: instrumented builds link the same
          # duckdb rlib chain, only larger.
          CARGO_BUILD_JOBS: 2
          # The line that makes this job possible — see the block above. Without
          # it the runner fills its disk and dies before reporting anything.
          # llvm-cov reads its line numbers from the coverage map, not DWARF, so
          # this costs the report nothing.
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info
      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ github.sha }}
          path: lcov.info
          retention-days: 14

  # Supply chain IS a gate (no continue-on-error). Complements notice.yml:
  # notice.yml asks "is NOTICE.md in sync"; this asks "is the dependency graph
  # allowed to exist at all" — licenses, advisories, yanked crates, and which
  # git sources may be pulled.
  supply-chain:
    name: cargo-deny (licenses + advisories + sources)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  i18n-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/i18n-check.sh

  no-standalone-arrow:
    name: No standalone arrow dep (type-chain protection)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify no `arrow = ` workspace/crate dep
        run: |
          if grep -rE '^arrow\s*=' Cargo.toml crates/*/Cargo.toml; then
            echo "::error::Standalone arrow dep would break duckdb::arrow type chain. See P2 retro #2."
            exit 1
          fi
          echo "OK: no standalone arrow dep"

  dat0-core-purity:
    name: dat0-core carries no UI toolkit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify no gpui/dioxus in the dat0-core dependency tree
        run: |
          # `dat0-core` is what makes the UI swappable: every module in it must
          # compile without knowing what is drawing. A toolkit dep sneaking in
          # via a re-export is invisible in review and fatal in a year.
          if cargo tree -p dat0-core -e normal | grep -qE '(gpui|dioxus)'; then
            echo "::error::dat0-core must not depend on a UI toolkit."
            cargo tree -p dat0-core -e normal | grep -E '(gpui|dioxus)'
            exit 1
          fi
          echo "OK: dat0-core is toolkit-free"

  no-debug-query-scalar:
    name: No __debug_query_scalar references (D-011 closure)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify no `__debug_query_scalar` references
        run: |
          if grep -rE '__debug_query_scalar' crates/ 2>/dev/null; then
            echo "::error::__debug_query_scalar was removed in P3a T5 (D-011). Use execute_paged instead."
            exit 1
          fi
          echo "OK: no __debug_query_scalar references"
