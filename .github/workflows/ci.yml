name: CI
on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs on the same branch/PR when a new commit lands.
# Stops minute-stacking from rapid-fire pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Incremental compilation is pure waste in CI and a real disk hazard here.
  # It only accelerates *re*builds within a persistent target dir; every CI run
  # starts clean, so the incremental caches are written, never reused, and then
  # thrown away — while consuming GBs (locally `target/debug/incremental` alone
  # reaches ~20 GB). Combined with duckdb's ~1.6 GB rlib and ~98 gpui-linked
  # integration-test binaries (~200-250 MB each), that pushed the hosted Ubuntu
  # runner over its disk limit: the runner PROCESS itself died with
  # `System.IO.IOException: No space left on device` mid-step, failing an
  # otherwise-green post-merge main run (b55758b) even though Build + Test +
  # MotherDuck had all passed. `Free disk space` is already maxed out, so the
  # only remaining lever is producing less.
  #
  # This is a build-CACHE setting: it changes no compiled output, so panic
  # backtraces and the crash-e2e assertions are unaffected. (`[profile.dev]
  # debug = "line-tables-only"` in Cargo.toml already minimises debuginfo —
  # dropping it further would degrade backtraces for no comparable win.)
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
        with: { components: rustfmt }
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
        with: { components: clippy }
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # Per-PR matrix kept narrow on purpose. Heavier coverage runs in
        # heavy.yml on a schedule (and on demand via `run-heavy` PR label).
        # macos-13 (Intel): D-006 — oversubscribed runner pool.
        # linux-arm64: moved to heavy.yml — adds ~30% minutes for marginal
        #   coverage delta vs linux-x86_64. Re-add if a real arm-Linux user
        #   surfaces.
        # `labels` is an array of runner labels. Hosted runners use a single
        # built-in label (e.g. `macos-14`). Self-hosted uses the registered
        # label set. `runs-on: ${{ fromJSON(...) }}` AND-matches all labels.
        target:
          - { labels: '["macos-14"]',                              triple: aarch64-apple-darwin,     name: macos-arm64  }
          # Temporarily routed back to ubuntu-latest while runnerkit host
          # is recovered (disk exhaustion 2026-05-26 on PR #5). Re-route to
          # runnerkit labels once host is restored. Billing impact: Linux
          # = 1x multiplier, ~1h per PR — manageable short-term.
          - { labels: '["ubuntu-latest"]',                         triple: x86_64-unknown-linux-gnu, name: linux-x86_64 }
    runs-on: ${{ fromJSON(matrix.target.labels) }}
    # Backstop against a hung step burning to GitHub's 6-hour default. The
    # OpenRouter soft-gate step did exactly that twice on PR #49 (its SSE stream
    # stalled without closing), and because the job never finished, the REQUIRED
    # check went down with it — `continue-on-error` cannot rescue a hang. That
    # step now has its own `timeout-minutes`; this is the job-level net for any
    # OTHER step that stalls. Well clear of normal cost (Linux ~75m, macOS ~40m).
    timeout-minutes: 120
    env:
      DAT0_SPARKLE_APPCAST_URL: https://dat0.dev/appcast.xml
      DAT0_GLITCHTIP_DSN_PUBLIC: ${{ secrets.GLITCHTIP_DSN_PUBLIC }}
      # LINUX: drop DWARF from dev/test binaries. This is the disk fix.
      #
      # MEASURED (the #53 telemetry, same commit, same profile):
      #   macOS  DISK[after-test] target= 32G  avail=6.5G
      #   Linux  DISK[after-test] target=110G  avail=5.6G   ← 97% full
      #   Linux  DISK[after-live-ai]          avail=2.6G    ← 99% full
      # A 3.4x platform gap on identical code: on macOS debug info is NOT linked
      # into the executable (it stays in .o/dSYM), but on Linux DWARF is EMBEDDED
      # in every one of the ~139 statically-linked (duckdb+gpui) test binaries.
      # So `[profile.dev] debug = "line-tables-only"` is nearly free on macOS and
      # enormously expensive on Linux — which is why Linux finishes at 99% disk and
      # intermittently dies with `No space left on device` (it reddened main on
      # b55758b and blocked #51). CARGO_INCREMENTAL=0 (#50) and the release-tree
      # reclaim (#52) together bought only ~4 GB; this is the real lever.
      #
      # ★ MUST be JOB-level, not step-level: Prime / Test / MotherDuck / OpenRouter
      # all build dev-profile artifacts, and a profile that differs between steps
      # changes the fingerprint → a FULL REBUILD, which would make disk *worse*.
      # Uses `matrix` (not `runner`) because the `runner` context is unavailable in
      # job-level `env`. The release profile is untouched (`Build` uses --release;
      # CARGO_PROFILE_DEV_* only affects dev/test).
      #
      # COST: Linux CI backtraces keep function names but lose file:line. Accepted
      # against a job running at 99% disk; flip this to `line-tables-only` on a
      # branch if a Linux-only failure ever needs precise line numbers.
      # The DISK[after-test] telemetry reports exactly what this buys.
      CARGO_PROFILE_DEV_DEBUG: ${{ matrix.target.name == 'linux-x86_64' && '0' || 'line-tables-only' }}
    steps:
      - uses: actions/checkout@v5
      # GitHub-hosted ubuntu-latest ships ~14 GB free disk by default;
      # dat0's debug-profile cargo test --workspace blows past that
      # (duckdb + arrow + gpui + sentry rlib chain). Free ~30 GB by
      # removing preinstalled language tooling we don't use.
      # See docs/ci-mac-vm-runner.md / docs/ci.md for the wider disk
      # story. Skipped on self-hosted (operator manages disk there).
      - name: Free disk space (hosted Linux only)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      # Disk telemetry (see .github/scripts/disk-report.sh for the full why).
      # The runner has intermittently died with `No space left on device` and we
      # had NO disk data, so every diagnosis — including a "~100 GB debug build"
      # that turned out to be ~23 GB — was guesswork. These snapshots make the
      # LOW-WATER MARK visible on every run, including failed ones. Grep `DISK[`.
      - name: 'Disk: baseline (after reclaim action)'
        if: always()
        run: |
          echo '| phase | avail | used | target/ |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          ./.github/scripts/disk-report.sh baseline "${{ matrix.target.triple }}"
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target.triple }}
      # apt + dbus-launch steps are skipped on self-hosted runners. Those
      # runners must have the listed packages pre-installed on the host image
      # (see docs/ci.md for the install command) and dbus/gnome-keyring
      # running as user services. runnerkit images do not include sudo
      # NOPASSWD, so per-job `sudo apt` fails. Hosted ubuntu-latest still
      # needs them installed in-job since the image is wiped per run.
      - name: Linux deps (keychain + GPUI)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsecret-1-dev dbus-x11 gnome-keyring \
            libpango1.0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libssl-dev
      - name: Linux — start dbus + gnome-keyring (Secret Service backend)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          eval "$(dbus-launch --sh-syntax)"
          eval "$(printf '\n' | gnome-keyring-daemon --unlock --start --components=secrets)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> $GITHUB_ENV
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
      - name: macOS — ensure Metal Toolchain is available
        if: runner.os == 'macOS'
        run: |
          # Probe whether the metal compiler is already on PATH (GitHub-hosted
          # Xcode bundles the Metal Toolchain by default on most images).
          if xcrun --find metal >/dev/null 2>&1; then
            echo "Metal Toolchain already present: $(xcrun --find metal)"
            exit 0
          fi
          # Newer Xcode (~26.x) ships Metal Toolchain as a separately-downloadable
          # component. The flag does not exist on older Xcode versions, so try it
          # but fall back if rejected.
          if xcodebuild -downloadComponent MetalToolchain 2>/dev/null; then
            echo "Metal Toolchain downloaded via xcodebuild."
            exit 0
          fi
          echo "::error::Metal Toolchain not present and xcodebuild -downloadComponent unsupported on this Xcode."
          echo "::error::xcodebuild version: $(xcodebuild -version | head -1)"
          exit 1
      - name: Build
        run: cargo build --workspace --release --target ${{ matrix.target.triple }}
      - name: 'Disk: after Build (release)'
        if: always()
        run: ./.github/scripts/disk-report.sh after-build-release "${{ matrix.target.triple }}"
      - name: Prime sqlite_scanner extension cache (avoid concurrent INSTALL race)
        run: |
          # `--target` keeps these in the SAME target/<triple>/ trees as the Build
          # (release) + Test (debug) steps. Without it, cargo builds separate host
          # `target/{release,debug}` trees — i.e. two MORE full DuckDB compiles
          # (one debug) on disk, which exhausted the ~14 GB ubuntu runner once
          # P7a added more test binaries. Reusing the trees frees that headroom.
          cargo run --release --target ${{ matrix.target.triple }} -p dat0-fixtures -- --out /tmp/dat0-prime --csv-bytes 4096 --sqlite-target-bytes 4096 || true
          # Force a one-shot INSTALL so subsequent test-binary processes find the extension cached.
          cargo test -p dat0-engine --target ${{ matrix.target.triple }} --test attach_dispatch -- --nocapture || true
      # The release tree is DEAD WEIGHT from here on — drop it before the debug
      # test build, which is what actually exhausts the disk.
      #
      # `Build` (release) and `Test` (debug) both land in target/<triple>/, so the
      # runner carries BOTH full trees at once (each with its own ~1.6 GB duckdb
      # rlib). The last Linux consumer of the release tree is the Prime step above
      # (`cargo run --release`); everything after this — Test, MotherDuck,
      # OpenRouter — is debug, and the bench + its own reclaim step are macOS-only.
      # So on Linux ~7.5 GB of release artifacts just sit there while the debug
      # tree (duckdb + ~98 gpui-linked test binaries) balloons past the limit. The
      # runner PROCESS itself then dies with `No space left on device` mid-step —
      # it reddened main on b55758b and blocked PR #51. `Free disk space` is
      # already maxed out and CARGO_INCREMENTAL=0 alone was not enough; this is the
      # remaining lever.
      #
      # Triggers no rebuild: nothing downstream asks for --release on Linux.
      # `df` before/after makes the headroom visible in the log — we previously had
      # no way to measure it.
      - name: Reclaim release tree before the debug test build (Linux)
        if: runner.os == 'Linux'
        run: |
          ./.github/scripts/disk-report.sh before-reclaim "${{ matrix.target.triple }}"
          du -sh "target/${{ matrix.target.triple }}/release" 2>/dev/null || true
          rm -rf "target/${{ matrix.target.triple }}/release"
          ./.github/scripts/disk-report.sh after-reclaim "${{ matrix.target.triple }}"
      - name: Test
        # `--include-ignored` deliberately omitted. Heavy exit_criteria tests
        # (1 GB CSV / 500 MB Parquet / 100 MB SQLite) run nightly via
        # heavy.yml. PR-time validation runs the fast suite only.
        #
        # CARGO_BUILD_JOBS caps concurrent rustc/link processes on hosted
        # Linux: ubuntu-latest has 4 vCPU + 16 GB RAM, and the dev-profile
        # link of dat0's test binary set (duckdb + arrow + gpui + sentry
        # rlib chain) OOM-kills `ld` (signal 7 Bus error) at default
        # parallelism. See docs/ci.md "OOM mitigations" §2.
        env:
          # Empty-string fallback would be re-read by cargo and rejected
          # ("could not parse ``"). Use the literal "default" for the
          # non-Linux branch so cargo treats it as the unset semantics.
          CARGO_BUILD_JOBS: ${{ (runner.os == 'Linux' && runner.environment == 'github-hosted') && '2' || 'default' }}
        run: cargo test --workspace --target ${{ matrix.target.triple }}
      # ★ THE LOW-WATER MARK. Every disk-exhaustion failure so far has struck at a
      # cargo step AFTER a green `Test` — the debug build is the peak consumer, so
      # this is the number that decides whether the job survives. `if: always()`
      # so we still capture it when a later step dies.
      - name: 'Disk: after Test (LOW-WATER MARK)'
        if: always()
        run: ./.github/scripts/disk-report.sh after-test "${{ matrix.target.triple }}"
      # P5c (D3): MotherDuck integration is a REQUIRED gate. The token is a
      # repo secret (Settings → Secrets and variables → Actions → MOTHERDUCK_TOKEN).
      # Fork PRs receive no secrets and will fail this step — acceptable for a
      # solo repo (design §7).
      - name: Require MotherDuck token
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          if [ -z "$MOTHERDUCK_TOKEN" ]; then
            echo "::error::MOTHERDUCK_TOKEN secret is required for P5c integration tests"
            exit 1
          fi
      - name: MotherDuck integration tests
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          CARGO_BUILD_JOBS: ${{ (runner.os == 'Linux' && runner.environment == 'github-hosted') && '2' || 'default' }}
        run: cargo test -p dat0-engine --test md_attach --target ${{ matrix.target.triple }} -- --include-ignored
      # P9c-1: OpenRouter AI round-trip is a REQUIRED gate (mirrors MD pattern).
      # Secret: Settings → Secrets and variables → Actions → OPENROUTER_API_KEY.
      - name: Require OpenRouter API key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY secret is required for P9c-1 AI integration tests"
            exit 1
          fi
      - name: OpenRouter AI integration tests
        # SOFT GATE (advisory, non-blocking). The live OpenRouter API is a flaky
        # third-party dependency: it intermittently returns empty responses
        # (`no choices[0].message.content` / `expected >=1 delta`), which reddened
        # main + PRs on transient outages repeatedly (P9c / P10a / P10a-2 — often
        # a DIFFERENT sub-test each run, and reruns did not clear it). Blocking a
        # required gate on a third-party outage is the wrong tradeoff. The
        # hermetic `ai::wire` unit tests in the --workspace Test step above remain
        # a HARD gate for the SSE/JSON parsing logic; this step is live smoke only.
        continue-on-error: true
        # `continue-on-error` only swallows a FAILURE — it cannot rescue a HANG.
        # Observed on PR #49: OpenRouter's SSE stream stalled without closing, so
        # `ai_live` blocked forever; the job never left this step and was killed
        # hours later, taking the REQUIRED build-and-test check down with it (once
        # as `cancelled`, once as `failure`) even though Build + Test + MotherDuck
        # had all already passed. That is precisely the "third-party outage blocks a
        # required gate" tradeoff this step is documented to avoid. Cap the step so
        # a stall fails fast and `continue-on-error` can do its job. 15m is well
        # clear of the normal cost (binary is already built by the Test step above;
        # the two serialized live calls take seconds).
        timeout-minutes: 15
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CARGO_BUILD_JOBS: ${{ (runner.os == 'Linux' && runner.environment == 'github-hosted') && '2' || 'default' }}
        # ai_live tests are `#[ignore]`d (live API) so the --workspace Test step
        # above stays hermetic; --include-ignored runs them HERE.
        # --test-threads=1 serializes the two live calls so they don't fire
        # simultaneously against the per-key rate window.
        run: cargo test -p dat0-app --test ai_live --target ${{ matrix.target.triple }} -- --include-ignored --test-threads=1 --nocapture
      # This is the exact step the runner has died on (disk-full, mid-step, leaving
      # it `in_progress/null` — deceptively hang-like). Snapshot here to see how
      # much headroom was actually left at the moment of death.
      - name: 'Disk: after live-AI step'
        if: always()
        run: ./.github/scripts/disk-report.sh after-live-ai "${{ matrix.target.triple }}"
      # Bench is macOS-only (single host class — variance across runners
      # makes cross-OS comparison meaningless). Artifact-only at P3a; spec
      # line 819 defers the merge-gate threshold to P10.
      #
      # Gated to push events (i.e. merges to main), NOT pull_request: `cargo
      # bench` recompiles DuckDB from source in a THIRD profile on top of the
      # debug (Test) + release (Build) trees, which exhausted the macOS runner's
      # ~14 GB disk on P5c PR runs ("No space left on device" in libduckdb-sys
      # ranlib), failing the whole job — and a disk-dead runner can't be rescued
      # by continue-on-error. Since the bench is advisory (not a gate), skip it
      # on PR CI to keep disk headroom; it still runs post-merge on main.
      # Reclaim disk before the bench. The bench command below has no `--target`,
      # so cargo builds a FRESH host tree in `target/{debug,release}` and
      # recompiles DuckDB a third time — on top of the Build (release) + Test
      # (debug) trees under `target/<triple>/`, which the bench never reuses.
      # That third profile exhausted the macOS runner's ~14 GB disk ("No space
      # left on device" crashing the runner worker — uncatchable by
      # continue-on-error). Dropping the `target/<triple>` tree (unused from here
      # on; MotherDuck tests already ran) frees both prior DuckDB builds first.
      # (A deeper fix would add `--target ${{ matrix.target.triple }}` to the
      # bench so it reuses the release tree; left as a future optimization.)
      - name: Reclaim disk before bench (macOS, push to main)
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: |
          df -h /
          rm -rf "target/${{ matrix.target.triple }}"
          df -h /
      - name: Bench — grid scroll (macOS only, push to main)
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: |
          cargo bench -p dat0-app --bench grid_scroll -- --output-format=bencher | tee bench.txt
      - name: Upload bench artifact
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: grid-scroll-bench-${{ github.sha }}
          path: bench.txt
          retention-days: 14

  i18n-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/i18n-check.sh

  no-standalone-arrow:
    name: No standalone arrow dep (type-chain protection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify no `arrow = ` workspace/crate dep
        run: |
          if grep -rE '^arrow\s*=' Cargo.toml crates/*/Cargo.toml; then
            echo "::error::Standalone arrow dep would break duckdb::arrow type chain. See P2 retro #2."
            exit 1
          fi
          echo "OK: no standalone arrow dep"

  no-debug-query-scalar:
    name: No __debug_query_scalar references (D-011 closure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify no `__debug_query_scalar` references
        run: |
          if grep -rE '__debug_query_scalar' crates/ 2>/dev/null; then
            echo "::error::__debug_query_scalar was removed in P3a T5 (D-011). Use execute_paged instead."
            exit 1
          fi
          echo "OK: no __debug_query_scalar references"
